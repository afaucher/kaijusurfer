<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kaiju Surfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Tilt+Neon&display=swap">
<style>
/* Layout: one phone-shaped stage, canvas fills it, HUD floats on top, overlays slide over. Single dark arcade look by choice. */
:root {
  --ink: #07040f;        /* night */
  --panel: #120a24;      /* overlay glass */
  --fg: #efe8ff;         /* text */
  --muted: #9a8fbd;      /* captions */
  --kaiju: #c45bff;      /* kaiju purple, the accent */
  --energy: #d6ff3d;     /* energy lime */
  --danger: #ff2448;     /* military red */
  --maze: #27d3ff;       /* neon street edge */
  --f-display: "Tilt Neon", "Chakra Petch", system-ui, sans-serif;
  --f-ui: "Chakra Petch", system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: #030108; color: var(--fg); font-family: var(--f-ui); overscroll-behavior: none; }
#app { height: 100%; display: flex; justify-content: center; }
#stage {
  position: relative; width: 100%; max-width: 480px; height: 100%; overflow: hidden;
  background: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.55)); }

/* HUD */
#hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
  padding: calc(var(--safe-top) + 10px) 12px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px;
}
.hud-l { display: flex; flex-direction: column; line-height: 1; }
.lbl { font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
#dist { font-family: var(--f-display); font-size: 30px; font-variant-numeric: tabular-nums; color: var(--fg); text-shadow: 0 0 10px rgba(196,91,255,.7); }
.hud-c { display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 4px; }
#arms { display: flex; gap: 4px; }
#arms i { width: 9px; height: 16px; border-radius: 5px 5px 2px 2px; background: var(--kaiju); box-shadow: 0 0 6px rgba(196,91,255,.8); transition: opacity .2s, transform .2s; }
#arms i.pluck { background: #f0c8ff; height: 12px; margin-top: 4px; border-radius: 6px; }
#arms i.lost { opacity: .18; box-shadow: none; transform: scaleY(.5) translateY(8px); }
#hpbar { width: 108px; height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
#hpbar b { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--danger), var(--kaiju)); }
.hud-r { display: flex; justify-content: flex-end; gap: 6px; pointer-events: auto; }
.hbtn {
  font: 700 11px/1 var(--f-ui); letter-spacing: .08em; color: var(--fg); background: rgba(18,10,36,.7);
  border: 1px solid rgba(196,91,255,.45); border-radius: 8px; padding: 8px 9px; cursor: pointer; text-transform: uppercase;
}
.hbtn:focus-visible, .ctl:focus-visible, .go:focus-visible { outline: 2px solid var(--energy); outline-offset: 2px; }

/* Bottom controls */
#controls {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none;
  padding: 0 14px calc(var(--safe-bottom) + 16px); display: flex; align-items: flex-end; justify-content: space-between;
}
.taphint { font: 700 11px var(--f-ui); letter-spacing: .14em; color: rgba(239,232,255,.32); text-transform: uppercase; display: flex; align-items: center; gap: 6px; padding-bottom: 18px; transition: color .15s; }
.taphint.on { color: var(--energy); }
.taphint span { font-size: 18px; }
.btns { display: flex; align-items: flex-end; gap: 12px; pointer-events: auto; }
.ctl {
  position: relative; border: 0; padding: 0; cursor: pointer; border-radius: 50%; color: var(--fg);
  display: grid; place-items: center; font: 700 10px/1.1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase;
}
#claw { width: 62px; height: 62px; background: radial-gradient(circle at 50% 40%, #3a1666, #1a0a30); box-shadow: inset 0 0 0 2px rgba(240,200,255,.55); }
#claw .cd { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.6) calc(var(--cd,0) * 1turn), transparent 0); }
#laser {
  width: 84px; height: 84px; --e: 0;
  background: conic-gradient(from -2deg, var(--energy) calc(var(--e) * 1turn), rgba(214,255,61,.13) 0);
}
#laser::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2a1048, #0d0619); }
#laser::after { /* three charge ticks */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from -2deg, #07040f 0 4deg, transparent 0 120deg, #07040f 0 124deg, transparent 0 240deg, #07040f 0 244deg, transparent 0);
  -webkit-mask: radial-gradient(circle, transparent 34px, #000 35px); mask: radial-gradient(circle, transparent 34px, #000 35px);
}
#laser > span, #claw > span { position: relative; z-index: 1; text-align: center; }
#laser b { display: block; font-family: var(--f-display); font-size: 22px; letter-spacing: 0; color: var(--energy); }
#laser.ready { box-shadow: 0 0 22px rgba(214,255,61,.45); }
#laser:not(.ready) b { color: var(--muted); }
#laser.deny { animation: deny .3s; }
@keyframes deny { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
#waveChip {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-bottom) + 112px); z-index: 2;
  font: 700 11px var(--f-ui); letter-spacing: .16em; color: var(--danger); background: rgba(40,4,14,.75);
  border: 1px solid rgba(255,36,72,.6); border-radius: 20px; padding: 5px 10px; pointer-events: none;
}
#waveChip b { font-variant-numeric: tabular-nums; }

/* Overlay */
#overlay {
  position: absolute; inset: 0; z-index: 5; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: rgba(7,4,15,.82); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  padding: calc(var(--safe-top) + 22px) 16px calc(var(--safe-bottom) + 22px);
}
.panel { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.logo {
  margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 54px; line-height: .92; letter-spacing: .02em; text-wrap: balance;
  color: #f6e6ff; text-shadow: 0 0 6px #c45bff, 0 0 18px #c45bff, 0 0 42px #7a2cff;
}
.logo em { font-style: normal; color: #eaffb0; text-shadow: 0 0 6px #d6ff3d, 0 0 20px #8fd400; }
.tag { margin: -6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.howto { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 13px; line-height: 1.35; }
.howto li { display: grid; grid-template-columns: 112px 1fr; gap: 10px; }
.howto b { color: var(--energy); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; padding-top: 2px; }
.sect { font-size: 10px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; margin: 2px 0 -6px; }
.guide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card { background: rgba(255,255,255,.04); border-radius: 10px; padding: 8px 6px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.card canvas { width: 60px; height: 60px; }
.card h3 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.card p { margin: 0; font-size: 11px; line-height: 1.3; color: var(--muted); }
.card.foe h3 { color: #ff8a9e; }
.card.nrg h3 { color: var(--energy); }
.go {
  font: 700 16px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: #12051f; cursor: pointer;
  background: var(--energy); border: 0; border-radius: 12px; padding: 15px; box-shadow: 0 0 24px rgba(214,255,61,.35);
}
.go.alt { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px rgba(239,232,255,.3); font-size: 13px; padding: 11px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: rgba(255,255,255,.05); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 28px; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--fg); }
.stat span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { #laser.deny { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="vignette"></div>
    <div id="hud">
      <div class="hud-l"><span class="lbl">Blocks climbed</span><span id="dist">000</span></div>
      <div class="hud-c"><div id="arms" aria-label="Arms remaining"></div><div id="hpbar"><b></b></div></div>
      <div class="hud-r"><button class="hbtn" id="pauseBtn" type="button" aria-label="Pause">II</button></div>
    </div>
    <div id="waveChip" hidden>Wave <b>0.0</b> blk behind</div>
    <div id="controls">
      <div class="taphint" id="tapL"><span>&#9664;</span>Tap</div>
      <div class="btns">
        <button class="ctl" id="claw" type="button"><i class="cd"></i><span>Claw</span></button>
        <button class="ctl" id="laser" type="button"><span>Laser<b id="charges">0</b></span></button>
      </div>
      <div class="taphint" id="tapR">Tap<span>&#9654;</span></div>
    </div>
    <div id="overlay"></div>
  </div>
</div>
<script>
(() => {
'use strict';
// ============================================================
//  Constants & helpers
// ============================================================
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const COLS = 5;              // vertical roads across the screen
const RW = 0.17;             // road half-width, world units (1 = one block)
const DIRS = { U: [0, 1], D: [0, -1], L: [-1, 0], R: [1, 0] };
const OPP = { U: 'D', D: 'U', L: 'R', R: 'L' };
const ANG = { U: -Math.PI / 2, D: Math.PI / 2, L: Math.PI, R: 0 };
const KSPEED = 2.6, CHARGE = 30, EMAX = 90;
const PELLET_E = 0.6, CELL_E = 5, CORE_E = 12;
const RAMP_TIME = 180;      // seconds from opening pace to full pace
const LATE_TOL = 0.3;        // how far past a junction a turn still snaps back
const CLAW_CD = 0.55, CLAW_R = 0.85;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const d2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;
function segDist(px, py, x1, y1, x2, y2) {
  const vx = x2 - x1, vy = y2 - y1, L = vx * vx + vy * vy || 1;
  const t = clamp(((px - x1) * vx + (py - y1) * vy) / L, 0, 1);
  return Math.hypot(px - (x1 + vx * t), py - (y1 + vy * t));
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

// ============================================================
//  Palette: neon night city
// ============================================================
const T = {
  bg: '#07040f', plaza: '#0a0618', road: '#0a0617', sidewalk: '#151030', lane: '#27d3ff',
  roof: '#0e0a22', roofEdge: '#1d1640', winWarm: '#ffcf6a', winCool: '#7fe6ff', winPink: '#ff6ad5',
  edge: '#27d3ff', edgeGlow: '#1a6dff', blasted: '#ff7a2f',
  bldg: '#120c26', bldgEdge: '#3b2f86', bldgTop: '#1b1338', bldgLight: '#ff3b6b', rubble: '#3a2a52', circuit: '#5a3cff',
  pellet: '#ffe36a', cell: '#4dffa6', cellEmpty: '#2b5a48', core: '#fff3a0', coreRing: '#ffd23f',
  kBody: '#2b0a52', kBody2: '#3d0f72', kEdge: '#c45bff', kLeg: '#9b3dff', kLight: '#f0c8ff', kEye: '#d6ff3d', kStump: '#5a1d8f',
  tank: '#ff8a3d', tankDark: '#2a1205', marine: '#ff4d6d', gren: '#ffb43d', danger: '#ff1f45', shell: '#ffd08a',
  orb: '#b6ff5a', text: '#ffffff', waveDark: '#16020b', fire: '#ff9a3d', white: '#ffffff', smoke: '#5a4a7a'
};

// ============================================================
//  Renderer: vector canvas in world units, additive glow sprites
// ============================================================
const glowCache = new Map();
function glowSprite(col) {
  let c = glowCache.get(col); if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, col); gr.addColorStop(0.25, col + 'aa'); gr.addColorStop(0.6, col + '33'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowCache.set(col, c); return c;
}

const NB = {
  g: null, s: 1, ox: 0, oy: 0,
  begin(g, s, ox, oy) { Object.assign(this, { g, s, ox, oy }); g.setTransform(s, 0, 0, s, -ox * s, -oy * s); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.setLineDash([]); g.lineCap = 'round'; g.lineJoin = 'round'; },
  alpha(a) { this.g.globalAlpha = a; },
  rect(x, y, w, h, col) { this.g.fillStyle = col; this.g.fillRect(x, y, w, h); },
  srect(x, y, w, h, lw, col) { const g = this.g; g.strokeStyle = col; g.lineWidth = lw; g.strokeRect(x, y, w, h); },
  circle(x, y, r, col) { const g = this.g; g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); },
  ring(x, y, r, w, col, dash, rot) { const g = this.g; g.strokeStyle = col; g.lineWidth = w; if (dash) g.setLineDash(dash); g.beginPath(); g.arc(x, y, r, rot || 0, (rot || 0) + TAU); g.stroke(); if (dash) g.setLineDash([]); },
  arc(x, y, r, a0, a1, w, col) { const g = this.g; g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke(); },
  line(x1, y1, x2, y2, w, col, dash) { const g = this.g; g.strokeStyle = col; g.lineWidth = w; if (dash) g.setLineDash(dash); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); if (dash) g.setLineDash([]); },
  poly(p, w, col) { const g = this.g; g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.stroke(); },
  curve(x0, y0, cx, cy, x1, y1, w, col) { const g = this.g; g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(cx, cy, x1, y1); g.stroke(); },
  glow(x, y, r, col, a) { const g = this.g, pa = g.globalAlpha; g.globalAlpha = pa * a; g.globalCompositeOperation = 'lighter'; g.drawImage(glowSprite(col), x - r, y - r, 2 * r, 2 * r); g.globalAlpha = pa; g.globalCompositeOperation = 'source-over'; },
  orect(x, y, ang, l, w, fill, stroke, sw) { const g = this.g; g.save(); g.translate(x, y); g.rotate(ang); if (fill) { g.fillStyle = fill; g.fillRect(-l / 2, -w / 2, l, w); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = sw; g.strokeRect(-l / 2, -w / 2, l, w); } g.restore(); },
  ellipse(x, y, rx, ry, ang, fill, stroke, sw) { const g = this.g; g.beginPath(); g.ellipse(x, y, rx, ry, ang, 0, TAU); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = sw; g.stroke(); } },
  vgrad(x, y, w, h, col, a0, a1) { const g = this.g, gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, rgba(col, a0)); gr.addColorStop(1, rgba(col, a1)); g.fillStyle = gr; g.fillRect(x, y, w, h); },
  text(x, y, str, size, col) { const g = this.g; g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.font = `700 ${Math.max(10, Math.round(size * this.s))}px "Chakra Petch", system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 8; g.fillText(str, (x - this.ox) * this.s, (y - this.oy) * this.s); g.restore(); }
};
const D = NB;

// ============================================================
//  Maze: 5 x infinite, generated row by row (Eller-style so every row leads up)
// ============================================================
const rows = new Map();   // r -> { h: Uint8Array(4), v: Uint8Array(5) }  0 wall, 1 road, 2 blasted
const blocks = new Map(); // r -> [4 blocks between row r and r+1]
let genTop = -1, genBottom = 0;
const H = (r, c) => { const R = rows.get(r); return R ? R.h[c] : 0; };
const V = (r, c) => { const R = rows.get(r); return R ? R.v[c] : 0; };
function open(c, r, d) {
  if (c < 0 || c >= COLS) return 0;
  switch (d) { case 'U': return V(r, c); case 'D': return V(r - 1, c); case 'L': return c > 0 ? H(r, c - 1) : 0; case 'R': return c < COLS - 1 ? H(r, c) : 0; }
  return 0;
}
function setEdge(c, r, d, val) {
  if (d === 'U') { const R = rows.get(r); if (R) R.v[c] = val; }
  else if (d === 'D') { const R = rows.get(r - 1); if (R) R.v[c] = val; }
  else if (d === 'L') { const R = rows.get(r); if (R && c > 0) R.h[c - 1] = val; }
  else { const R = rows.get(r); if (R && c < COLS - 1) R.h[c] = val; }
}
function segmentsOf(h) { const segs = []; let cur = [0]; for (let c = 1; c < COLS; c++) { if (h[c - 1]) cur.push(c); else { segs.push(cur); cur = [c]; } } segs.push(cur); return segs; }
function genRow(r) {
  const h = new Uint8Array(COLS - 1), v = new Uint8Array(COLS);
  const reached = []; for (let c = 0; c < COLS; c++) reached[c] = r === 0 || !!V(r - 1, c);
  for (let c = 0; c < COLS - 1; c++) h[c] = (r < 3 || Math.random() < 0.52) ? 1 : 0;
  for (let guard = 0; guard < 10; guard++) {        // join any run that can't be reached from below
    const bad = segmentsOf(h).find(s => !s.some(c => reached[c])); if (!bad) break;
    const L = bad[0], Rr = bad[bad.length - 1]; let dl = Infinity, dr = Infinity;
    for (let c = L - 1; c >= 0; c--) if (reached[c]) { dl = L - c; break; }
    for (let c = Rr + 1; c < COLS; c++) if (reached[c]) { dr = c - Rr; break; }
    if (dl <= dr) h[L - 1] = 1; else h[Rr] = 1;
  }
  for (const s of segmentsOf(h)) {                  // every run gets at least one way up
    const up = pick(s); v[up] = 1;
    for (const c of s) if (c !== up && Math.random() < 0.28) v[c] = 1;
  }
  rows.set(r, { h, v });
}
// A block is a 3x3 grid of city lots: center = core or tower, ring of 8 = building or energy cell.
// Pellets line every sidewalk that faces an open road.
const LOT = 0.155;
function makeBlocks(r) {
  const arr = [];
  for (let c = 0; c < COLS - 1; c++) {
    const cx = c + 1, cy = -(r + 0.5), b = { r, c, cx, cy, pellets: [], lots: [], core: null, seed: Math.random() };
    const sides = [[H(r, c), 0, 1], [H(r + 1, c), 0, -1], [V(r, c), -1, 0], [V(r, c + 1), 1, 0]];
    const off = 0.5 - RW - 0.07;
    for (const [isOpen, sx, sy] of sides) {
      if (!isOpen) continue;
      for (const t of [-0.2, -0.07, 0.07, 0.2]) {
        if (Math.random() < 0.12) continue;
        const x = cx + (sx ? sx * off : t), y = cy + (sy ? sy * off : t);
        b.pellets.push({ x, y, alive: true, targeted: false });
      }
    }
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
      if (!i && !j) continue;
      const x = cx + i * LOT, y = cy + j * LOT;
      if (Math.random() < 0.45) b.lots.push({ kind: 'bldg', x, y, h: rand(0.3, 1), shade: Math.random(), broken: false });
      else b.lots.push({ kind: 'cell', x, y, full: Math.random() < 0.6, broken: false });
    }
    if (Math.random() < 0.72) b.core = { kind: 'core', x: cx, y: cy, full: Math.random() < 0.7, broken: false };
    else b.core = { kind: 'bldg', x: cx, y: cy, h: 1.3, shade: Math.random(), tower: true, broken: false };
    arr.push(b);
  }
  blocks.set(r, arr);
}
function ensureRows(target) { while (genTop < target) { genTop++; genRow(genTop); if (genTop > 0) makeBlocks(genTop - 1); } }
function cleanupRows(minKeep) { while (genBottom < minKeep) { rows.delete(genBottom); blocks.delete(genBottom); genBottom++; } }

// ============================================================
//  Movers: anything that rides the road graph
// ============================================================
class Mover {

  get x() { return this.c + 0.5 + DIRS[this.dir][0] * this.t; }
  get y() { return -(this.r + DIRS[this.dir][1] * this.t); }
  near() { if (this.t < 0.5) return [this.c, this.r]; const v = DIRS[this.dir]; return [this.c + v[0], this.r + v[1]]; }

      if (this.t === 0 && !open(this.c, this.r, this.dir)) { choose(this); if (!open(this.c, this.r, this.dir)) return; }

      if (dist < need) { this.t += dist; return; }

      choose(this);

  }
  reverse() { const v = DIRS[this.dir]; this.c += v[0]; this.r += v[1]; this.t = 1 - this.t; this.dir = OPP[this.dir]; }
}

    else if (--K.wantTTL <= 0) K.want = null;
  }
  if (open(m.c, m.r, m.dir)) return;

  const d = m.dir, side = K.lastSide;

}
function steer(d) {

  if (d === OPP[m.dir]) {

}
const walkersAlive = () => K.arms.filter(a => a.type === 'walk' && a.alive).length;

function updateKaiju(dt) {

function update(dt) {

  }
  if (state === 'play' || state === 'title') updateKaiju(state === 'play' ? sdt : dt);

    if (runTime > 25) { artyT -= sdt; if (artyT <= 0) { artyT = lerp(8, 4.5, diff); scheduleArtillery(); } }
    if (runTime > 55) { airT -= sdt; if (airT <= 0) { airT = lerp(14, 8, diff); scheduleAirstrike(); } }
    updateEnemies(sdt, diff); updateShots(sdt); updateTeles(sdt); updateOrbs(dt);   // orbs stay on real time: the 1 s rule is fixed

    if (jet) { jet.life -= dt; if (jet.life <= 0) jet = null; }

    shakeX = (Math.random() - 0.5) * shakeAmt * 0.5; shakeY = (Math.random() - 0.5) * shakeAmt * 0.5;
    const target = K.ry - VIEW_H * 0.62;

}

  D.line(x - ca * 0.13 - sa * 0.1, y - sa * 0.13 + ca * 0.1, x + ca * 0.13 - sa * 0.1, y + sa * 0.13 + ca * 0.1, 0.012, T.tank, [0.025, 0.02]);
  D.line(x - ca * 0.13 + sa * 0.1, y - sa * 0.13 - ca * 0.1, x + ca * 0.13 + sa * 0.1, y + sa * 0.13 - ca * 0.1, 0.012, T.tank, [0.025, 0.02]);
  D.line(x, y, x + ca * 0.24, y + sa * 0.24, 0.03, T.tank); D.circle(x, y, 0.065, T.tankDark); D.ring(x, y, 0.065, 0.016, T.tank);
  if (aiming) { D.alpha(0.5 + 0.5 * Math.sin(now * 40)); D.line(x + ca * 0.25, y + sa * 0.25, x + ca * 3, y + sa * 3, 0.015, T.danger, [0.08, 0.06]); D.alpha(1); }
}
const FORM = [[0, 0], [-0.09, 0.07], [0.09, 0.07], [-0.07, -0.08], [0.07, -0.08]];
function drawMarines(x, y, n, seed) {
  for (let i = 0; i < n; i++) {
    const px = x + FORM[i][0] + Math.sin(now * 9 + i * 2 + seed * 10) * 0.012, py = y + FORM[i][1] + Math.cos(now * 8 + i * 3) * 0.012;
    D.glow(px, py, 0.07, T.marine, 0.6); D.circle(px, py, 0.024, T.marine);
  }
}
function drawGrenadier(x, y) {
  D.glow(x, y, 0.12, T.gren, 0.6); D.circle(x, y, 0.038, T.gren); D.ring(x, y, 0.065, 0.01, T.gren, [0.02, 0.02], now * 3);
}
function drawTeles() {
  for (const t of teles) {
    const p = t.t / t.max, blink = 0.55 + 0.45 * Math.sin(now * (10 + p * 20));
    if (t.kind === 'arty') {
      D.alpha(0.12 + 0.12 * blink); D.circle(t.x, t.y, t.R, T.danger); D.alpha(1);
      D.ring(t.x, t.y, t.R, 0.03, T.danger, [0.12, 0.08], now * 2);
      D.ring(t.x, t.y, t.R * (1 + (1 - p) * 0.9), 0.02, T.danger);
      D.line(t.x - t.R * 0.5, t.y, t.x + t.R * 0.5, t.y, 0.02, T.danger); D.line(t.x, t.y - t.R * 0.5, t.x, t.y + t.R * 0.5, 0.02, T.danger);
      D.text(t.x, t.y - t.R - 0.16, 'ARTILLERY', 0.13, T.danger);
    } else {
      const vx = t.x2 - t.x1, vy = t.y2 - t.y1, L = Math.hypot(vx, vy), nx = -vy / L * 0.27, ny = vx / L * 0.27;
      D.alpha(0.1 + 0.12 * blink);
      D.rect(Math.min(t.x1, t.x2) - Math.abs(nx), Math.min(t.y1, t.y2) - Math.abs(ny), Math.abs(vx) + 2 * Math.abs(nx), Math.abs(vy) + 2 * Math.abs(ny), T.danger);
      D.alpha(1);
      D.line(t.x1 + nx, t.y1 + ny, t.x2 + nx, t.y2 + ny, 0.035, T.danger);
      D.line(t.x1 - nx, t.y1 - ny, t.x2 - nx, t.y2 - ny, 0.035, T.danger);
      const ux = vx / L, uy = vy / L, off = (now * 2.5) % 0.45;
      D.alpha(blink);
      for (let s = off; s < L; s += 0.45) { const cx = t.x1 + ux * s, cy = t.y1 + uy * s; D.poly([cx - ux * 0.08 + nx * 0.5, cy - uy * 0.08 + ny * 0.5, cx, cy, cx - ux * 0.08 - nx * 0.5, cy - uy * 0.08 - ny * 0.5], 0.025, T.danger); }
      D.alpha(1);
      D.text(t.x1 + ux * 0.1 + nx * 1.9, t.y1 + uy * 0.1 + ny * 1.9 + (Math.abs(uy) > 0.5 ? 0 : -0.1), 'AIRSTRIKE', 0.13, T.danger);
    }
  }
  for (const g of grenades) {
    const p = g.t / g.max, x = lerp(g.x0, g.x1, p), y = lerp(g.y0, g.y1, p), h = Math.sin(p * Math.PI) * 0.6;
    D.ring(g.x1, g.y1, 0.45, 0.02, T.danger, [0.06, 0.05], now * 3);
    D.alpha(0.4); D.circle(x, y, 0.03, '#000000'); D.alpha(1);
    D.circle(x, y - h, 0.03, T.gren);

}
function drawWave(top, bottom) {
  if (waveY > bottom + 1) return;
  const wy = waveY;
  D.vgrad(0, wy - 1.4, 5, 1.4, T.danger, 0, 0.3);
  D.alpha(0.88); D.rect(0, wy, 5, bottom - wy + 1, T.waveDark); D.alpha(1);
  for (let iy = 0; iy < 14; iy++) {
    const y = wy + 0.22 + iy * 0.3; if (y > bottom + 0.3) break;
    for (let ix = 0; ix < 11; ix++) {
      const x = 0.2 + ix * 0.46 + (iy % 2) * 0.23 + Math.sin(now * 3 + ix + iy * 2) * 0.03;
      const k = hash(ix, iy);
      if (k < 0.4) drawTank(x, y + Math.sin(now * 2 + ix) * 0.02, -Math.PI / 2, false);
      else drawMarines(x, y, 3, k);
    }
  }
  for (let i = 0; i < 3; i++) {   // searchlights
    const bx = 0.8 + i * 1.7, a = -Math.PI / 2 + Math.sin(now * 0.8 + i * 2) * 0.6;
    D.alpha(0.08);
    const p = [bx, wy, bx + Math.cos(a - 0.12) * 3.2, wy + Math.sin(a - 0.12) * 3.2, bx + Math.cos(a + 0.12) * 3.2, wy + Math.sin(a + 0.12) * 3.2];
    const g = D.g;
    g.fillStyle = '#fff6c8'; g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[2], p[3]); g.lineTo(p[4], p[5]); g.fill();
    D.alpha(1);
  }
  D.line(0, wy, 5, wy, 0.04, T.danger, [0.14, 0.08]);
  D.alpha(0.5); D.line(0, wy, 5, wy, 0.16, T.danger); D.alpha(1);
  for (let i = 0; i < 3; i++) if (Math.random() < 0.5) { const x = rand(0.2, 4.8); D.glow(x, wy + 0.15, 0.15, T.fire, 0.9); D.circle(x, wy + 0.12, 0.03, T.white); }
}
function drawWorld() {
  const top = camY + shakeY - 0.5, bot = camY + shakeY + VIEW_H + 0.5;
  const rLo = Math.floor(-bot) - 1, rHi = Math.ceil(-top) + 1;
  drawCity();
  for (let r = rLo; r <= rHi; r++) { const bl = blocks.get(r); if (bl) for (const b of bl) drawBlockBase(b); }
  drawRoads(rLo, rHi);
  for (let r = rLo; r <= rHi; r++) { const bl = blocks.get(r); if (bl) for (const b of bl) drawBlockNodes(b); }
  for (const o of orbs) {
    const a = o.life / o.max, rr = o.big ? 0.07 : 0.05;
    D.glow(o.x, o.y, rr * 4, T.orb, 0.8 * a);
    D.alpha(0.4 + 0.6 * a); D.circle(o.x, o.y, rr * (0.6 + 0.4 * a), T.orb); D.alpha(1);
    D.ring(o.x, o.y, rr * 1.8, 0.012, T.orb, null);
  }
  for (const d of debris) {
    D.alpha(Math.min(1, d.life / 0.6));
    const t = d.max - d.life, mx = (d.x1 + d.x2) / 2 + d.vx * t * 0.4, my = (d.y1 + d.y2) / 2 + d.vy * t * 0.4;
    const L = Math.hypot(d.x2 - d.x1, d.y2 - d.y1) / 2, a = Math.atan2(d.y2 - d.y1, d.x2 - d.x1) + d.rot;
    limb([mx - Math.cos(a) * L, my - Math.sin(a) * L, mx + Math.cos(a + 0.4) * L * 0.2, my + Math.sin(a + 0.4) * L * 0.2, mx + Math.cos(a) * L, my + Math.sin(a) * L], 0.045);
    D.alpha(1);
  }
  for (const e of enemies) {
    const x = e.m.x, y = e.m.y;
    if (e.type === 'tank') drawTank(x, y, e.aim > 0 ? ANG[e.aimDir] : ANG[e.m.dir], e.aim > 0);
    else if (e.type === 'marines') drawMarines(x, y, e.n, e.seed);
    else drawGrenadier(x, y);
  }
  if (!K.dead) drawKaiju(K.rx, K.ry, K.ang, K.arms, K.flash, K.absorb);
  if (slash) {
    const p = 1 - slash.life / slash.max, a0 = slash.ang - 1.6 + p * 0.6, a1 = slash.ang + 1.6 - p * 0.6;
    D.alpha(1 - p);
    D.arc(K.rx, K.ry, CLAW_R * (0.6 + p * 0.4), a0, a1, 0.16, T.kEdge);
    D.arc(K.rx, K.ry, CLAW_R * (0.6 + p * 0.4), a0, a1, 0.05, T.kLight);
    D.arc(K.rx, K.ry, CLAW_R * (0.45 + p * 0.4), a0 + 0.3, a1 - 0.3, 0.03, T.kLight);
    D.alpha(1);
  }
  for (const s of shots) {
    if (s.kind === 'shell') { D.glow(s.x, s.y, 0.15, T.fire, 0.9); D.line(s.x, s.y, s.x - s.vx * 0.04, s.y - s.vy * 0.04, 0.04, T.shell); D.circle(s.x, s.y, 0.035, T.white); }
    else D.line(s.x, s.y, s.x - s.vx * 0.025, s.y - s.vy * 0.025, 0.018, T.shell);
  }
  drawTeles();
  if (jet) { const p = 1 - jet.life / jet.max, x = lerp(jet.x1, jet.x2, p * 1.3), y = lerp(jet.y1, jet.y2, p * 1.3); D.alpha(0.35); D.poly([x - 0.25, y + 0.15, x, y - 0.2, x + 0.25, y + 0.15], 0.08, '#000000'); D.alpha(1); }
  if (beam) {
    const p = beam.life / beam.max, w = 0.14 + 0.2 * p;
    D.alpha(0.5 * p); D.line(beam.x1, beam.y1, beam.x2, beam.y2, w * 2.2, T.kEdge); D.alpha(1); D.line(beam.x1, beam.y1, beam.x2, beam.y2, w * 0.45, T.white);
  }
  for (const p of parts) { D.alpha(Math.max(0, p.life / p.max)); D.circle(p.x, p.y, p.r, p.col); } D.alpha(1);
  for (const r of rings) { const p = 1 - r.life / r.max; D.alpha(1 - p); D.ring(r.x, r.y, lerp(r.r0, r.r1, p), r.w, r.col); } D.alpha(1);
  drawWave(top, bot);
  for (const f of floaters) { D.alpha(Math.min(1, f.life / 0.4)); D.text(f.x, f.y, f.text, 0.16, f.col); } D.alpha(1);
}

// ============================================================
//  Canvas sizing & frame
// ============================================================
const stage = $('#stage'), cvs = $('#game'), ctx = cvs.getContext('2d');
let W = 0, Hh = 0, DPR = 1;
function resize() {
  const r = stage.getBoundingClientRect(); W = r.width; Hh = r.height; DPR = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(Hh * DPR);
  VIEW_H = Hh / (W / 5);
  buildCityTile(cvs.width, cvs.width / 5);
}
function render() {
  NB.begin(ctx, cvs.width / 5, shakeX, camY + shakeY);
  drawWorld();
}

// ============================================================
//  HUD
// ============================================================
const armsEl = $('#arms'), distEl = $('#dist'), hpEl = $('#hpbar b'), laserEl = $('#laser'), chargesEl = $('#charges'), clawEl = $('#claw'), waveChip = $('#waveChip');
function buildArmPips() {
  armsEl.innerHTML = K.arms.map(a => `<i class="${a.type === 'pluck' ? 'pluck' : ''} ${a.alive ? '' : 'lost'}"></i>`).join('');
}
let lastHud = '';
function hud() {
  const blk = Math.max(0, K.maxRow - K.startRow), ch = Math.floor(K.energy / CHARGE);
  const key = [blk, Math.round(K.hp), Math.round(K.energy * 2), ch, Math.round(K.clawCD * 20)].join();
  if (key !== lastHud) {
    lastHud = key;
    distEl.textContent = String(blk).padStart(3, '0');
    hpEl.style.width = clamp(K.hp, 0, 100) + '%';
    laserEl.style.setProperty('--e', (K.energy / EMAX).toFixed(3));
    chargesEl.textContent = ch; laserEl.classList.toggle('ready', ch > 0);
    clawEl.style.setProperty('--cd', (K.clawCD / CLAW_CD).toFixed(2));
  }
  const gap = waveY - (camY + VIEW_H);
  const show = state === 'play' && gap > 0;
  waveChip.hidden = !show;
  if (show) waveChip.querySelector('b').textContent = (waveY - K.ry).toFixed(1);
}

// ============================================================
//  Overlays & field guide
// ============================================================
const overlay = $('#overlay');
const GUIDE = [
  { id: 'kaiju', name: 'Kaiju', note: '6 walking arms, 2 plucking arms. Hits cost arms.', cls: '' },
  { id: 'pellet', name: 'Pellets', note: 'Outer layer. Plucked as you pass.', cls: 'nrg' },
  { id: 'cell', name: 'Cells', note: 'Middle layer, between buildings. Full or empty.', cls: 'nrg' },
  { id: 'core', name: 'Core', note: 'Inner layer. Laser or blasts only. Absorb within 1s.', cls: 'nrg' },
  { id: 'marines', name: 'Marines', note: 'Edible squad. Rifles at close range.', cls: 'foe' },
  { id: 'gren', name: 'Grenadier', note: 'Edible. Grenades crack cells.', cls: 'foe' },
  { id: 'tank', name: 'Tank', note: 'Aims, then fires straight down roads.', cls: 'foe' },
  { id: 'arty', name: 'Artillery', note: 'Red circle, then three shells.', cls: 'foe' },
  { id: 'air', name: 'Airstrike', note: 'Parallel lines mark the bomb run.', cls: 'foe' }
];
const miniArms = makeArms();
function drawMini(id) {
  switch (id) {
    case 'kaiju': restFeet(miniArms, 0, 0.05, ANG.U); for (const a of miniArms) if (a.type === 'walk') { a.fx += Math.sin(now * 6 + a.a * 3) * 0.03; } drawKaiju(0, 0.05, ANG.U, miniArms, 0, 0.3 + 0.2 * Math.sin(now * 3)); break;
    case 'pellet': D.rect(-0.6, 0.06, 1.2, 0.3, T.road); for (let i = -2; i <= 2; i++) drawPellet(i * 0.13, -0.06); break;
    case 'cell': drawBuilding({ x: -0.16, y: -0.12, h: 0.8, shade: 0.7 }); drawCell({ x: 0.14, y: -0.12, full: true }); drawCell({ x: -0.14, y: 0.16, full: false }); drawBuilding({ x: 0.16, y: 0.16, h: 0.3, shade: 0.2 }); break;
    case 'core': drawCore({ x: 0, y: 0, full: true }); break;
    case 'marines': drawMarines(0, 0, 5, 0.3); break;
    case 'gren': drawGrenadier(0, 0); D.ring(0.22, -0.2, 0.18, 0.02, T.danger, [0.05, 0.04], now * 3); break;
    case 'tank': drawTank(0, 0.1, ANG.U, Math.sin(now * 2) > 0); break;
    case 'arty': { const R = 0.36, p = (now % 1.7) / 1.7; D.alpha(0.2); D.circle(0, 0, R, T.danger); D.alpha(1); D.ring(0, 0, R, 0.025, T.danger, [0.08, 0.05], now * 2); D.ring(0, 0, R * (1 + (1 - p) * 0.7), 0.018, T.danger); D.line(-0.18, 0, 0.18, 0, 0.02, T.danger); D.line(0, -0.18, 0, 0.18, 0.02, T.danger); break; }
    case 'air': { D.alpha(0.18); D.rect(-0.2, -0.6, 0.4, 1.2, T.danger); D.alpha(1); D.line(-0.2, -0.6, -0.2, 0.6, 0.03, T.danger); D.line(0.2, -0.6, 0.2, 0.6, 0.03, T.danger); const off = (now * 0.8) % 0.3; for (let y = 0.6 - off; y > -0.6; y -= 0.3) D.poly([-0.1, y + 0.06, 0, y, 0.1, y + 0.06], 0.025, T.danger); break; }
  }
}
const miniCanvases = [];
function renderMinis() {
  const SPAN = { kaiju: 1.15, pellet: 0.75, cell: 0.6, core: 0.42, marines: 0.45, gren: 0.7, tank: 0.62, arty: 1.0, air: 1.4 };
  for (const { cv, id } of miniCanvases) {
    const span = SPAN[id] || 1.2;
    NB.begin(cv.getContext('2d'), cv.width / span, -span / 2, -span / 2); D.rect(-1, -1, 2, 2, T.bg); drawMini(id);
  }
}
function showOverlay(kind) {
  overlay.hidden = false; miniCanvases.length = 0;
  const guide = `<div class="sect">Field guide</div><div class="guide">${GUIDE.map(g => `<div class="card ${g.cls}"><canvas data-mini="${g.id}" width="120" height="120"></canvas><h3>${g.name}</h3><p>${g.note}</p></div>`).join('')}</div>`;
  const howto = `<ul class="howto">
      <li><b>Tap left / right</b><span>Turn at the next junction. Late taps still count.</span></li>
      <li><b>Swipe up / down</b><span>Climb or back off. Walls bounce you up first.</span></li>
      <li><b>Claw</b><span>Short swipe in front. Kills or eats what it hits and cracks cells.</span></li>
      <li><b>Laser</b><span>Costs ⅓ energy. Blasts up to two walls and anything on the road.</span></li></ul>`;
  let html = '';
  if (kind === 'title') {
    html = `<div class="panel"><h1 class="logo">Kaiju<br><em>Surfer</em></h1>
      <p class="tag">Climb the city maze, harvest its power grid and eat the army. Keep moving: the wave is right behind you.</p>
      ${howto}${guide}<button class="go" type="button" data-act="start">Start climbing</button></div>`;
  } else if (kind === 'pause') {
    html = `<div class="panel"><h1 class="logo">Paused</h1><button class="go" type="button" data-act="resume">Resume</button><button class="go alt" type="button" data-act="start">Restart run</button>${howto}${guide}</div>`;
  } else {
    html = `<div class="panel"><h1 class="logo">Kaiju<br><em>down</em></h1>
      <div class="stats">
        <div class="stat"><b>${Math.max(0, K.maxRow - K.startRow)}</b><span>Blocks climbed</span></div>
        <div class="stat"><b>${Math.round(stats.harvested)}</b><span>Energy harvested</span></div>
        <div class="stat"><b>${stats.eaten}</b><span>Soldiers eaten</span></div>
        <div class="stat"><b>${stats.armsLost}</b><span>Arms lost</span></div></div>
      <button class="go" type="button" data-act="start">Climb again</button></div>`;
  }
  overlay.innerHTML = html;
  overlay.querySelectorAll('canvas[data-mini]').forEach(cv => { cv.width = cv.height = Math.round(60 * DPR); miniCanvases.push({ cv, id: cv.dataset.mini }); });
  renderMinis();
}
overlay.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act === 'start') { reset(); state = 'play'; overlay.hidden = true; }
  if (b.dataset.act === 'resume') { state = 'play'; overlay.hidden = true; }
});

// ============================================================
//  Input
// ============================================================
let gesture = null;
function tapHint(side) { const el = side === 'L' ? $('#tapL') : $('#tapR'); el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 160); }
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button, #overlay')) return;
  e.preventDefault(); gesture = { id: e.pointerId, x: e.clientX, y: e.clientY, done: false };
});
stage.addEventListener('pointermove', e => {
  if (!gesture || gesture.done || e.pointerId !== gesture.id) return;
  const dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
  if (Math.abs(dy) > 26 && Math.abs(dy) > Math.abs(dx) * 1.2) { steer(dy < 0 ? 'U' : 'D'); gesture.done = true; }
  else if (Math.abs(dx) > 34) { const s = dx < 0 ? 'L' : 'R'; steer(s); tapHint(s); gesture.done = true; }
});
const endGesture = e => {
  if (!gesture || e.pointerId !== gesture.id) return;
  if (!gesture.done && e.type === 'pointerup') { const r = stage.getBoundingClientRect(), s = (gesture.x - r.left) < r.width / 2 ? 'L' : 'R'; steer(s); tapHint(s); }
  gesture = null;
};
stage.addEventListener('pointerup', endGesture); stage.addEventListener('pointercancel', endGesture);
$('#laser').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fireLaser(); });
$('#claw').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); claw(); });
$('#laser').addEventListener('click', e => { if (e.detail === 0) fireLaser(); });
$('#claw').addEventListener('click', e => { if (e.detail === 0) claw(); });
$('#pauseBtn').addEventListener('click', () => { if (state === 'play') { state = 'pause'; showOverlay('pause'); } else if (state === 'pause') { state = 'play'; overlay.hidden = true; } });
const KEYS = { ArrowLeft: 'L', a: 'L', ArrowRight: 'R', d: 'R', ArrowUp: 'U', w: 'U', ArrowDown: 'D', s: 'D' };
addEventListener('keydown', e => {
  if (KEYS[e.key]) { e.preventDefault(); steer(KEYS[e.key]); }
  else if (e.key === ' ') { e.preventDefault(); fireLaser(); }
  else if (e.key === 'x' || e.key === 'Shift') { claw(); }
  else if ((e.key === 'Escape' || e.key === 'p') && (state === 'play' || state === 'pause')) $('#pauseBtn').click();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { state = 'pause'; showOverlay('pause'); } });
addEventListener('resize', resize);

// ============================================================
//  Boot
// ============================================================
let last = performance.now(), miniTick = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(state === 'pause' ? 0 : dt);
  render(); hud();
  if (!overlay.hidden && (miniTick++ & 1)) renderMinis();
  requestAnimationFrame(frame);
}
resize(); reset(); showOverlay('title');
window.__kaiju = { K, get state() { return state; }, steer, fireLaser, claw, start() { reset(); state = 'play'; overlay.hidden = true; }, step(n, dt) { for (let i = 0; i < n; i++) update(dt || 1 / 60); render(); hud(); }, get enemies() { return enemies; }, get pace() { return lerp(0.5, 1, ramp); }, get runTime() { return runTime; }, scheduleAirstrike, scheduleArtillery };
requestAnimationFrame(frame);
})();
</script>
